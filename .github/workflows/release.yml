name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check
        run: |
          node --check index.js
          node --check client.js
          node test/test-client.mjs
      - name: Pack the plugin
        run: |
          npm pack --silent
          # A version-free asset name keeps the marketplace `tarball:` URL from
          # rotting when a later release is cut.
          mv ./*.tgz dsh-commandcode-quota.tgz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ./dsh-commandcode-quota.tgz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
