# Bundle patch: inserts the plugin row that provides the Command Code panel.
# The user's own patch layer may override this config later.
- insert:
    - id: commandcode-quota
      name: '@yumiku/dsh-commandcode-quota'
      config:
        apiBase: https://api.commandcode.ai
        apiKeyEnv: COMMAND_CODE_API_KEY
        planOverride: ''
        cacheMs: 45000
        timeoutMs: 12000
